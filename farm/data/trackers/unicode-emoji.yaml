# 三个 emoji 数据文件都是**非归档**源（照 Arch 原样装）→ 放 work_sources。
# 注意 emoji 数据的版本号**不跟 UCD 走**：上游目前最高只到 16.0（UCD 已 18.0.0）。
pkg-name: unicode-emoji
version-source: work_sources[0]
work_sources:
- tracker-template: multi-level-html-index
  levels:
  - name: version
    url: https://www.unicode.org/Public/emoji/
    pattern: 'href="([0-9]+\.[0-9]+)/"'
  template: https://www.unicode.org/Public/emoji/{version}/emoji-sequences.txt
- tracker-template: multi-level-html-index
  levels:
  - name: version
    url: https://www.unicode.org/Public/emoji/
    pattern: 'href="([0-9]+\.[0-9]+)/"'
  template: https://www.unicode.org/Public/emoji/{version}/emoji-test.txt
- tracker-template: multi-level-html-index
  levels:
  - name: version
    url: https://www.unicode.org/Public/emoji/
    pattern: 'href="([0-9]+\.[0-9]+)/"'
  template: https://www.unicode.org/Public/emoji/{version}/emoji-zwj-sequences.txt
