pkg-name: plasma-desktop
tracker-template: script
script-content: |
  pkg=plasma-desktop
  base=https://download.kde.org/stable/plasma
  listing=$(curl -fsSL "$base/")
  dir=$(printf '%s\n' "$listing" | grep -o 'href="[0-9][0-9.]*/"' | sed 's/href="//; s/"//; s/\/$//' | sort -V | tail -n1)
  test -n "$dir" || exit 1
  page=$(curl -fsSL "$base/$dir/")
  version=$(printf '%s\n' "$page" | grep -o "$pkg-[0-9][0-9.]*\.tar\.xz" | sed "s/^$pkg-//; s/\.tar\.xz$//" | sort -V | tail -n1)
  test -n "$version" || exit 1
  echo "$version"
  echo "$base/$dir/$pkg-$version.tar.xz"
