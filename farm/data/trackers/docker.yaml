pkg-name: docker
version-source: sources[0]
sources:
  - tracker-template: github
    repo: docker/cli
    mode: tags
    tag-prefix: v
    template: https://github.com/{repo}/archive/refs/tags/{tag}.tar.gz
  - tracker-template: script
    version-var:
      main: sources[0]
    script: |
      echo "$main|https://github.com/moby/moby/archive/refs/tags/docker-v$main.tar.gz"
  - tracker-template: github
    repo: krallin/tini
    mode: tags
    tag-prefix: v
    template: https://github.com/{repo}/archive/refs/tags/{tag}.tar.gz
