pkg-name: gnome-keyring
version-source: sources[0]
sources:
  - tracker-template: gnome
    source-name: gnome-keyring
    # GNOME 应用（非核心库）用 GNOME 发布号当版本：51.0/51.1 都是稳定点发布，51 是奇数。
    # 模板默认的"偶 minor=稳定"假设不适用 → 关掉
    stable-minor: all
    template: https://download.gnome.org/sources/gnome-keyring/{path_version}/gnome-keyring-{version}.tar.xz
