pkg-name: sqlite
tracker-template: script
script-content: |
  #!/bin/bash
  set -e
  # 官方 src 包（非 autoconf 包）：PRODUCT 行 = PRODUCT,版本,年/文件名，直连 sqlite.org
  html=$(curl -s https://www.sqlite.org/download.html)
  prod=$(echo "$html" | grep -oE 'PRODUCT,[0-9.]+,[0-9]+/sqlite-src-[0-9]+\.zip' | head -1)
  ver=$(echo "$prod" | cut -d, -f2)
  path=$(echo "$prod" | cut -d, -f3)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://www.sqlite.org/$path"
