pkg-name: gn
type: script
script-content: |
  #!/bin/bash
  set -e
  # VERSION 文件路径 404，改用提交落地(committer)日期 + hash 作版本。
  # author 日期是原始提交日——gn 的 commit 常被 cherry-pick 后才上 main，author 可能比
  # 当前版本旧（假倒退）；committer 日期 = 落地日，随 main 单调递增。
  json=$(curl -fsSL "https://gn.googlesource.com/gn/+log/main?format=JSON&n=1" | sed "1s/)]}'//")
  HASH=$(printf '%s' "$json" | grep -oE '"commit": "[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}')
  TIME=$(printf '%s' "$json" | python3 -c "import json,sys; print(json.load(sys.stdin)['log'][0]['committer']['time'])")
  # git 时间格式 "Sat Aug 29 20:13:26 2026 -0700"，GNU date 解析不了时区后缀，取月日年
  DATE=$(date -u -d "$(echo "$TIME" | awk '{print $2, $3, $5}')" +%Y%m%d)
  echo "${DATE}.${HASH:0:8}"
  echo "https://gn.googlesource.com/gn/+archive/${HASH}.tar.gz"
