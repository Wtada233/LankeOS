pkg-name: font-noto-sans-cjk
version-source: sources[0]
sources:
  - tracker-template: github
    repo: googlefonts/noto-cjk
    mode: tags
    tag-prefix: Sans
    # 上游把 ttc 放在 tag 树里的原始路径（不是 release 资产），raw 直链。
    template: https://github.com/googlefonts/noto-cjk/raw/{tag}/Sans/OTC/NotoSansCJK-Regular.ttc
