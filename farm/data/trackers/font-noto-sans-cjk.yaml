pkg-name: font-noto-sans-cjk
type: script
script-content: |
  #!/bin/bash
  tags=$(curl -sL "https://api.github.com/repos/googlefonts/noto-cjk/tags?per_page=100" | grep '"name"' | sed 's/.*"name": "\(.*\)",/\1/')
  tag=$(echo "$tags" | grep '^Sans' | sort -V | tail -1)
  version=${tag#Sans}
  echo "$version"
  echo "https://github.com/googlefonts/noto-cjk/raw/$tag/Sans/OTC/NotoSansCJK-Regular.ttc"
