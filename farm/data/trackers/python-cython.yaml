pkg-name: python-cython
type: script
script-content: |
  tags=$(git ls-remote --tags https://github.com/cython/cython 2>/dev/null \
    | awk -F/ '$NF ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ {print $NF}' \
    | sort -V)
  latest=$(printf '%s\n' "$tags" | tail -n1)
  test -n "$latest" || exit 1
  echo "$latest"
  echo "https://github.com/cython/cython/archive/refs/tags/${latest}.tar.gz"
