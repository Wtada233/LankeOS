pkg-name: python-cython
version-source: sources[0]
sources:
  # PyPI 是 cython 的正式分发渠道，与其余 python-* 包一致（argcomplete / fastjsonschema /
  # trove-classifiers 等都用 pypi 模板）——cython 此前是唯一走 github tags 的异类。
  #
  # 那个异类身份正是它需要 `exclude` 的原因：上游同时发 `3.3.0` 与 PEP 440 预发布
  # （`3.3.0a1` / `3.3.0b1`，历史上有 13 个），而预发布按版本比较排在正式版**之后**，
  # naive max 会选到 beta（实测踩过两次：`3.3.0b1`、`3.3.0b1-3`）。
  # 这在 PyPI 侧早已解决：`info.version` 本身优先稳定版，模板侧也按 PEP 440 识别预发布。
  - tracker-template: pypi
    project: cython
