# python.org 版本目录含开发版占位（如 3.15.0 只有 alpha/beta，无正式 Python-3.15.0.tar.xz）。
# 用 script 模板从高到低逐个探测正式 tarball，只接受真实存在的版本（稳定线）。
pkg-name: python
tracker-template: script
script-content: |
  #!/bin/bash
  html=$(curl -fsSL https://www.python.org/ftp/python/) || exit 1
  for ver in $(printf '%s\n' "$html" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+/' | tr -d '/' | sort -uVr); do
      url="https://www.python.org/ftp/python/${ver}/Python-${ver}.tar.xz"
      if curl -fsI "$url" >/dev/null 2>&1; then
          echo "$ver"
          echo "$url"
          exit 0
      fi
  done
  exit 1
