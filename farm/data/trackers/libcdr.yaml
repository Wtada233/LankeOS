pkg-name: libcdr
type: script
script-content: |
  page=$(curl -fsSL "https://dev-www.libreoffice.org/src/libcdr/")
  ver=$(printf '%s\n' "$page" | grep -oE "libcdr-[0-9.]+\.tar\.xz" | sed "s/^libcdr-//; s/\.tar\.xz$//" | sort -V | tail -n1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://dev-www.libreoffice.org/src/libcdr/libcdr-$ver.tar.xz"
