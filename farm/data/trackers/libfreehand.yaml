pkg-name: libfreehand
type: script
script-content: |
  page=$(curl -fsSL "https://dev-www.libreoffice.org/src/libfreehand/")
  ver=$(printf '%s\n' "$page" | grep -oE "libfreehand-[0-9.]+\.tar\.xz" | sed "s/^libfreehand-//; s/\.tar\.xz$//" | sort -V | tail -n1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://dev-www.libreoffice.org/src/libfreehand/libfreehand-$ver.tar.xz"
