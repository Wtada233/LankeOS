# libpinyin — 拼音库。源用 release tarball，模型数据（data/*.table + interpolation2.text）
# 已随包分发，因此**不需要 work_sources**。
# Arch 的 PKGBUILD 要用 modelNN.text.tar.gz 是因为它拿的是 git+ 源（git 树里没有那些
# 大文件）；tarball 下那套是多余的，且源码树里的文件与 model20 逐字节相同。
pkg-name: libpinyin
version-source: sources[0]
sources:
- tracker-template: github
  repo: libpinyin/libpinyin
  mode: releases
  tag-prefix: ''
  template: https://github.com/libpinyin/libpinyin/releases/download/{tag}/libpinyin-{version}.tar.gz
