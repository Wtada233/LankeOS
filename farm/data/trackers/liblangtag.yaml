pkg-name: liblangtag
type: script
script-content: |
  page=$(curl -fsSL "https://dev-www.libreoffice.org/src/")
  ver=$(printf '%s\n' "$page" | grep -oE "liblangtag-[0-9.]+\.tar\." | sed "s/^liblangtag-//; s/\.tar\..*$//" | sort -V | tail -n1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://dev-www.libreoffice.org/src/liblangtag-$ver.tar.xz"
