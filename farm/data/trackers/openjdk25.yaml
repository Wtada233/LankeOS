pkg-name: openjdk25
type: script
script-content: |
  #!/bin/bash
  TAGS=$(git ls-remote --tags https://github.com/openjdk/jdk25u.git 2>/dev/null \
         | sed 's/.*refs\/tags\///; s/\^{}//' | sort -u \
         | grep -E '^jdk-[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' | sort -V)
  BEST=$(printf '%s\n' "$TAGS" | tail -1)
  test -n "$BEST" || exit 1
  VER=$(printf '%s' "$BEST" | sed -E 's/^jdk-([0-9.]+)\+.*/\1/')
  echo "$VER"
  echo "https://github.com/openjdk/jdk25u/archive/refs/tags/${BEST}.tar.gz"
