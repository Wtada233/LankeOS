pkg-name: libexttextcat
type: script
script-content: |
  page=$(curl -fsSL "https://dev-www.libreoffice.org/src/libexttextcat/")
  ver=$(printf '%s\n' "$page" | grep -oE "libexttextcat-[0-9.]+\.tar\.xz" | sed "s/^libexttextcat-//; s/\.tar\.xz$//" | sort -V | tail -n1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://dev-www.libreoffice.org/src/libexttextcat/libexttextcat-$ver.tar.xz"
