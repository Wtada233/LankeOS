pkg-name: extra-cmake-modules
type: script
script-content: |
  base=https://download.kde.org/stable/frameworks
  listing=$(curl -fsSL "$base/")
  dir=$(printf '%s\n' "$listing" | grep -o 'href="[0-9][0-9.]*/"' | sed 's/href="//; s/"//; s/\/$//' | sort -V | tail -n1)
  test -n "$dir" || exit 1
  page=$(curl -fsSL "$base/$dir/")
  version=$(printf '%s\n' "$page" | grep -o 'extra-cmake-modules-[0-9][0-9.]*\.tar\.xz' | sed 's/extra-cmake-modules-//; s/\.tar\.xz//' | head -n1)
  test -n "$version" || exit 1
  echo "$version"
  echo "$base/$dir/extra-cmake-modules-$version.tar.xz"
