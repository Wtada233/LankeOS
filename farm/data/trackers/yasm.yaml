pkg-name: yasm
type: script
script-content: |
  # 版本 = 最后一个 tag（动态获取，不硬编码）+ master HEAD 的 ts.hash（滚动）。
  # tag 作为版本基线：新 tag（如 v1.3.1）→ 基线跳到 1.3.1；
  ver=$(git ls-remote --tags https://github.com/yasm/yasm | sed 's|.*refs/tags/||; s|\^{}$||' | sort -V | tail -1)
  test -n "$ver" || exit 1
  ver=${ver#v}
  hash=$(git ls-remote https://github.com/yasm/yasm HEAD | awk '$2=="HEAD"{print $1; exit}')
  test -n "$hash" || exit 1
  tmp=$(mktemp -d)
  git clone -q --depth 1 https://github.com/yasm/yasm "$tmp/yasm" 2>/dev/null
  relver=$(git -C "$tmp/yasm" show -s --format=%ct 2>/dev/null)
  rm -rf "$tmp"
  test -n "$relver" || exit 1
  short=$(printf '%s' "$hash" | cut -c1-7)
  echo "${ver}.${relver}.${short}"
  echo "https://github.com/yasm/yasm/archive/${hash}.tar.gz"
