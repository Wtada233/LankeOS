pkg-name: nauty
type: script
script-content: |
  set -e
  listing=$(curl -fsSLk "https://pallini.di.uniroma1.it/")
  f=$(printf '%s\n' "$listing" | grep -oE 'nauty[0-9]+_[0-9]+_[0-9]+\.tar\.gz' | sort -V | tail -n1)
  test -n "$f" || exit 1
  v=$(printf '%s' "$f" | sed 's/nauty//; s/\.tar\.gz$//; s/_/./g')
  echo "$v"
  echo "https://pallini.di.uniroma1.it/$f"
