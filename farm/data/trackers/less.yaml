pkg-name: less
sources:
  - tracker-template: script
    script: |
      HTML=$(curl -s https://www.greenwoodsoftware.com/less/)
      ver=$(echo "$HTML" | grep -o 'current released version is less-[0-9]*' | sed 's/.*less-//' | head -1)
      if [ -z "$ver" ]; then exit 1; fi
      echo "$ver|https://www.greenwoodsoftware.com/less/less-$ver.tar.gz"
