# gitlab.gnome 归档 tarball（tag 带 v 前缀，version 去 v）
pkg-name: blueprint-compiler
version-source: sources[0]
sources:
- tracker-template: gitlab
  host: gitlab.gnome.org
  mode: tags
  tag-prefix: v
  project: GNOME/blueprint-compiler
  template: https://gitlab.gnome.org/{project}/-/archive/{tag}/{name}-{tag}.tar.gz
