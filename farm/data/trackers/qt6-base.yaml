pkg-name: qt6-base
type: script
script-content: |
  base="https://download.qt.io/official_releases/qt/"
  minor=$(curl -fsSL "$base" | grep -oE '>[0-9]+\.[0-9]+/<' | tr -d '>/<' | sort -V | grep '^6\.' | tail -1)
  test -n "$minor" || exit 1
  patch=$(curl -fsSL "${base}${minor}/" | grep -oE '>[0-9]+\.[0-9]+\.[0-9]+/<' | tr -d '>/<' | sort -V | tail -1)
  test -n "$patch" || exit 1
  echo "$patch"
  echo "https://download.qt.io/official_releases/qt/$minor/$patch/submodules/qtbase-everywhere-src-$patch.tar.xz"
