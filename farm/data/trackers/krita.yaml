pkg-name: krita
tracker-template: script
script-content: |
  pkg=krita
  base=https://download.kde.org/stable/krita
  listing=$(curl -fsSL "$base/")
  dir=$(printf '%s\n' "$listing" | grep -o 'href="[0-9][0-9.]*/"' | sed 's/href="//; s/"//; s/\/$//' | sort -V | tail -n1)
  test -n "$dir" || exit 1
  echo "$dir"
  echo "$base/$dir/$pkg-$dir.tar.xz"
