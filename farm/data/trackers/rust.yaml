pkg-name: rust
tracker-template: script
# static.rust-lang.org/dist/ 不是 GCS 桶（?delimiter=/ 返回 416），稳定版从 channel-rust-stable.toml 的 [pkg.rust] 段取
script-content: |
  #!/bin/bash
  set -e
  toml=$(curl -fsSL https://static.rust-lang.org/dist/channel-rust-stable.toml)
  ver=$(printf '%s\n' "$toml" | awk '/^\[pkg\.rust\]/{f=1} f&&/^version/{print; exit}' | grep -oE '[0-9]+\.[0-9.]+' | head -1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://static.rust-lang.org/dist/rustc-${ver}-src.tar.xz"
