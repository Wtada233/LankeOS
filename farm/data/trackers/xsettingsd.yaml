pkg-name: xsettingsd
tracker-template: script
script-content: |
  tags=$(git ls-remote --tags https://codeberg.org/derat/xsettingsd 2>/dev/null)
  version=$(printf '%s\n' "$tags" | grep 'refs/tags/v[0-9][0-9.]*$' | sed 's#.*refs/tags/v##' | sort -V | tail -n1)
  test -n "$version" || exit 1
  echo "$version"
  echo "https://codeberg.org/derat/xsettingsd/archive/v${version}.tar.gz"
