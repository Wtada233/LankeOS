pkg-name: libpagemaker
type: script
script-content: |
  page=$(curl -fsSL "https://dev-www.libreoffice.org/src/libpagemaker/")
  ver=$(printf '%s\n' "$page" | grep -oE "libpagemaker-[0-9.]+\.tar\.xz" | sed "s/^libpagemaker-//; s/\.tar\.xz$//" | sort -V | tail -n1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://dev-www.libreoffice.org/src/libpagemaker/libpagemaker-$ver.tar.xz"
