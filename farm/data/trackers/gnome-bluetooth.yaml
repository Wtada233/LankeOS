# 源 = Arch gnome-bluetooth-3.0（libgnome-bluetooth gtk4 线）
pkg-name: gnome-bluetooth
version-source: sources[0]
sources:
  - tracker-template: gnome
    source-name: gnome-bluetooth
    # 版本跟 GNOME 发布号（单段目录如 51/），odd minor 不是 dev（GNOME 40 起废弃偶/奇）→ 不设 stable-minor 会误排除
    stable-minor: all
    template: https://download.gnome.org/sources/gnome-bluetooth/{path_version}/gnome-bluetooth-{version}.tar.xz
