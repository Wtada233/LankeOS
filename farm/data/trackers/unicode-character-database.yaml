# work_sources-only：UCD/Unihan 两个 zip 都是上游发布形态（Arch 用 noextract），版本来自
# /Public/ 下的版本目录名。
pkg-name: unicode-character-database
version-source: work_sources[0]
work_sources:
- tracker-template: multi-level-html-index
  levels:
  - name: version
    url: https://www.unicode.org/Public/
    pattern: 'href="([0-9]+\.[0-9]+\.[0-9]+)/"'
  template: https://www.unicode.org/Public/{version}/ucd/UCD.zip
- tracker-template: multi-level-html-index
  levels:
  - name: version
    url: https://www.unicode.org/Public/
    pattern: 'href="([0-9]+\.[0-9]+\.[0-9]+)/"'
  template: https://www.unicode.org/Public/{version}/ucd/Unihan.zip
