pkg-name: mariadb
version-source: sources[0]
sources:
  # 必须 `mode: releases`：GitHub `/releases/latest` 只返回最新**非 prerelease**。
  # mariadb-13.0.1 是 prerelease（archive.mariadb.org 里 13.0.0/13.1.0 是未打 tag 的预览构建），
  # `mode: tags` 走 git 协议列全量 tag 会把 prerelease 当最新 —— 不能用。
  # 端点与旧脚本完全相同（都是 /releases/latest），API 开销不变。
  - tracker-template: github
    repo: MariaDB/server
    mode: releases
    tag-prefix: mariadb-
    template: git+https://github.com/MariaDB/server.git@{tag}
