pkg-name: libodfgen
# release tarball 直接位于 dev-www.libreoffice.org/src/ 根（非子目录）→ 探测根页面
tracker-template: script
script-content: |
  page=$(curl -fsSL "https://dev-www.libreoffice.org/src/")
  ver=$(printf '%s\n' "$page" | grep -oE "libodfgen-[0-9.]+\.tar\." | sed "s/^libodfgen-//; s/\.tar\..*$//" | sort -V | tail -n1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://dev-www.libreoffice.org/src/libodfgen-$ver.tar.xz"
