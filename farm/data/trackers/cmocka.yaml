pkg-name: cmocka
version-source: sources[0]
sources:
- tracker-template: multi-level-html-index
  levels:
  - name: series
    url: https://cmocka.org/files/
    pattern: 'href="([0-9]+\.[0-9]+)/"'
  - name: version
    url: https://cmocka.org/files/{series}/
    pattern: cmocka-([0-9][0-9.]*)\.tar\.xz
  template: https://cmocka.org/files/{series}/cmocka-{version}.tar.xz
