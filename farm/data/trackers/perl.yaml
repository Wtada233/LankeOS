# perl 稳定版 = 偶数 minor（5.44/5.42/...），奇数 minor（5.45）是开发版（ABI 不稳定）。
# 用 script 模板从高到低找第一个偶数 minor（最新稳定版）。
pkg-name: perl
tracker-template: script
script-content: |
  #!/bin/bash
  html=$(curl -fsSL https://www.cpan.org/src/5.0/) || exit 1
  for ver in $(printf '%s\n' "$html" | grep -oE 'perl-5\.[0-9]+\.[0-9]+\.tar\.xz' | sed 's/perl-//; s/\.tar\.xz//' | sort -uVr); do
      minor=$(echo "$ver" | cut -d. -f2)
      if [ $((10#$minor % 2)) -eq 0 ]; then
          echo "$ver"
          echo "https://www.cpan.org/src/5.0/perl-${ver}.tar.xz"
          exit 0
      fi
  done
  exit 1
