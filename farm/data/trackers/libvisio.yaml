pkg-name: libvisio
# release 托管在 dev-www.libreoffice.org（download.gnome.org 没有）→ script 探测 LO 镜像
tracker-template: script
script-content: |
  page=$(curl -fsSL "https://dev-www.libreoffice.org/src/libvisio/")
  ver=$(printf '%s\n' "$page" | grep -oE "libvisio-[0-9.]+\.tar\.xz" | sed "s/^libvisio-//; s/\.tar\.xz$//" | sort -V | tail -n1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://dev-www.libreoffice.org/src/libvisio/libvisio-$ver.tar.xz"
