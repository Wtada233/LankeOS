pkg-name: seatd
tracker-template: script
script-content: |
  #!/bin/bash
  set -e
  repo="https://git.sr.ht/~kennylevinsen/seatd"
  tags=$(git ls-remote --tags --refs "$repo" | sed 's#.*refs/tags/##')
  tag=$(printf '%s\n' "$tags" | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1)
  if [ -z "$tag" ]; then
    tag=$(printf '%s\n' "$tags" | sort -V | tail -n1)
  fi
  echo "$tag"
  echo "https://git.sr.ht/~kennylevinsen/seatd/archive/${tag}.tar.gz"
