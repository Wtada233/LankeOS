pkg-name: cryptsetup
tracker-template: script
script-content: |
  base=https://www.kernel.org/pub/linux/utils/cryptsetup
  dir=$(curl -fsSL "$base/" | grep -oE 'v[0-9]+\.[0-9]+/' | sed 's|/||' | sort -V | tail -n1)
  test -n "$dir" || exit 1
  page=$(curl -fsSL "$base/$dir/")
  version=$(printf '%s\n' "$page" | grep -oE 'cryptsetup-[0-9][0-9.]*\.tar\.xz' | sed 's/cryptsetup-//; s/\.tar\.xz//' | sort -V | tail -n1)
  test -n "$version" || exit 1
  echo "$version"
  echo "$base/$dir/cryptsetup-$version.tar.xz"
