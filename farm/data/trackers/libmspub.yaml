pkg-name: libmspub
type: script
script-content: |
  page=$(curl -fsSL "https://dev-www.libreoffice.org/src/libmspub/")
  ver=$(printf '%s\n' "$page" | grep -oE "libmspub-[0-9.]+\.tar\.xz" | sed "s/^libmspub-//; s/\.tar\.xz$//" | sort -V | tail -n1)
  test -n "$ver" || exit 1
  echo "$ver"
  echo "https://dev-www.libreoffice.org/src/libmspub/libmspub-$ver.tar.xz"
