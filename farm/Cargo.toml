[package]
name = "lankefarm"
version = "0.1.0"
edition = "2021"
description = "LankeOS build farm — ABI-driven incremental package builder (design per farm/ARCH.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
thiserror = "2"
regex = "1"
ureq = { version = "2", features = ["tls"] }
clap = { version = "4", features = ["derive"] }
# `.lpkg` 的读写走**系统 libarchive**（`src/libarchive_ffi.rs` 的手写绑定）—— 与格式写方 lpkg
# 同一份 .so、同一版本。不用 binding crate：那些要么停更，要么自带一份静态 libarchive
# （版本分叉 + 构建期把 cmake/bindgen/libclang 塞进自举路径），且表达不了非 UTF-8 成员名与 default ACL。
goblin = "0.9"
# git 协议列 tag（`mode: tags` 要**全量** tag，REST 端点是分页窗口）——
# 链系统 libgit2（lpkg 的 `git+` 源用的是同一个库，本系统已装）。
git2 = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
ctrlc = "3"
libc = "0.2"

[dev-dependencies]
# 测试 fixture 用 tar/zstd 现打：与生产路径的 libarchive 是**不同实现**，于是顺带成为
# "farm 能读懂别的实现写出的 .lpkg" 的对照网；xattr 用于断言 xattr 往返。
tar = "0.4"
zstd = "0.13"
xattr = "1"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
