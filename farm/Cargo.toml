[package]
name = "lankefarm"
version = "0.1.0"
edition = "2021"
description = "LankeOS build farm — ABI-driven incremental package builder (design per farm/ARCH.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
thiserror = "2"
regex = "1"
ureq = { version = "2", features = ["tls"] }
clap = { version = "4", features = ["derive"] }
tar = "0.4"
# 读条目的 xattr（repack 打包时写成 PAX 的 `SCHILY.xattr.*`；解包侧由 tar 的 xattr feature 还原）。
# 本来就在依赖树里（tar 的传递依赖），显式声明才能直接用。
xattr = "1"
zstd = "0.13"
goblin = "0.9"
# git 协议列 tag（`mode: tags` 要**全量** tag，REST 端点是分页窗口）——
# 链系统 libgit2（lpkg 的 `git+` 源用的是同一个库，本系统已装）。
git2 = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
ctrlc = "3"
libc = "0.2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
