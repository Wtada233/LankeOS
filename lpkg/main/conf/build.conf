# lpkg 默认构建标志（参考 Arch Linux makepkg.conf，ISA 基线 x86-64-v3）
#
# 这是系统级默认配置，由 make install 安装到 /etc/lpkg/build.conf。
# 文件缺失时回退到内置默认（main/src/base/build_defaults.hpp）。
#
# 作用范围：lpkg build 的 lankebuild_prepare / lankebuild_build / lankebuild_package
# 三个阶段。exec 前会 export CFLAGS/CXXFLAGS/LDFLAGS/MAKEFLAGS 到构建环境，
# configure/make/cmake 自动继承。
#
# 注意：基线默认 x86-64-v3（AVX2/FMA 等），绝不能写 -march=native —— native 会把
# 构建宿主机超出基线的 CPU 特性烙进二进制，破坏发行版包的可移植性。
#
# 逐包覆盖：LankeBUILD.json 的 cflags / cxxflags / ldflags / makeflags / lto 字段
# 优先级最高；留空 = 使用本文件（再没有 = build_defaults.hpp）。

CFLAGS="-march=x86-64-v3 -mtune=generic -O2 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"

CXXFLAGS="-march=x86-64-v3 -mtune=generic -O2 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -Wp,-D_GLIBCXX_ASSERTIONS"

LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,pack-relative-relocs"

LTOFLAGS="-flto=auto"

MAKEFLAGS="-j$(nproc)"
